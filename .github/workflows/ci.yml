name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    # Ten was enough when this job was a lint and a few hundred tests. It is
    # not enough now: the server suite alone is over a thousand tests, each
    # spawning a real server against a real database, and `npm ci` for three
    # package trees can take most of ten minutes on its own when the registry
    # is slow. Two runs in a row were killed part-way through a passing suite,
    # which reads as a broken build and is not one. This is a ceiling to catch
    # something genuinely hung, so it should sit well clear of how long the
    # work actually takes.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Lint client
        run: npm --prefix client run lint

      - name: Server tests
        run: npm --prefix server test

      - name: Client tests
        run: npm --prefix client test

      - name: Build client
        run: npm --prefix client run build
        env:
          NODE_ENV: production

      - name: Reject a production start without JWT_SECRET
        run: |
          set +e
          output=$(NODE_ENV=production node server/src/index.js 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Server started in production without JWT_SECRET"
            exit 1
          fi
          if ! echo "$output" | grep -q "Refusing to start in production"; then
            echo "::error::Server exited for an unexpected reason"
            echo "$output"
            exit 1
          fi
          echo "Server correctly refused to start without JWT_SECRET."

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Same reason as the job above, and the same evidence: a run was killed
    # here with every one of its checks passing and a handful left to go. This
    # job installs three package trees, downloads a browser, seeds a shop and
    # then drives a couple of hundred checks through it, so the ceiling has to
    # sit clear of a slow morning on the registry rather than just above a good
    # one.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: npm run e2e
        env:
          E2E_SCREENSHOT_DIR: e2e-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          if-no-files-found: ignore
          retention-days: 7
