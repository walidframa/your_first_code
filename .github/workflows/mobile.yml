# Building the phone app.
#
# Separate from `ci.yml` because it answers a different question and costs more
# to ask: CI proves the code is sound on every push, this produces something a
# person can install on a phone. Running the Android toolchain on every commit
# would add minutes to a check that is meant to be quick.
#
# The APK it produces is a **debug** build. It installs on any Android phone
# without a Play Store account and without signing keys, which is exactly what
# is wanted for the shop's own phones and for handing a copy to somebody to try.
# Releasing to the Play Store is a signed `.aab`, and that needs a keystore that
# must never be in a repository — see docs/mobile.md.
name: Phone app

on:
  # By hand, when there is a build worth handing to somebody.
  workflow_dispatch:
  # And on a tag, so a released version always has an installable file next to
  # it rather than one somebody has to remember to build.
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only this job writes, and only to publish the file as a release — see the
    # steps at the end. The workflow's own default stays read-only.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      # The Android SDK is already on this runner; the JDK is what has to be
      # named, because Gradle picks whichever it finds and Capacitor 7 wants 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Build the web app
        run: npm --prefix client run build
        env:
          NODE_ENV: production

      # Copies the built pages into the Android project and updates the plugin
      # list. Without it the app ships whatever `dist` was committed, which is
      # nothing.
      #
      # `working-directory` is load-bearing, not tidiness. `cap` reads
      # capacitor.config.json from the directory it is *run in*, and
      # `npm --prefix client exec` changes where npm looks for the package
      # without changing the cwd — so from the repo root it looked for `./android`
      # at the root, found nothing, and said the platform had never been added.
      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync android

      - name: Build the APK
        working-directory: client/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name it after the commit
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: front-desk-${{ steps.name.outputs.sha }}-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------- the link
      #
      # An artifact is not a download link. It expires after thirty days, it
      # arrives as a zip, and GitHub asks whoever clicks it to sign in — so it
      # cannot be sent to a shopkeeper, which is the whole reason somebody
      # wants the file.
      #
      # A release asset can. It never expires, it downloads as the .apk itself,
      # and on a public repository it needs no account.
      #
      # **One address, for ever.** The release lives under a fixed tag rather
      # than a version, and the file always has the same name, so the link on
      # the shop's own paperwork keeps working after the next build:
      #
      #     https://github.com/OWNER/REPO/releases/download/app/front-desk.apk
      #
      # Deleted and recreated rather than edited, so the release points at the
      # commit it was actually built from. A rolling tag left where it was
      # first cut is a release page that lies about what is in the file.
      - name: Name the file after nothing, so the link never changes
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk front-desk.apk
          ls -l front-desk.apk

      - name: Publish it as the current app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(printf 'The Android app, built from %s on %s.\n\nInstall it by opening this link on the phone:\nhttps://github.com/%s/releases/download/app/front-desk.apk\n\nAndroid will warn about installing outside the Play Store — that is expected for a build handed out directly. The app asks for the shop address the first time it opens.\n' \
            "${{ steps.name.outputs.sha }}" "$(date -u '+%d %B %Y')" "$GITHUB_REPOSITORY")

          # `|| true`: there is nothing to delete the first time.
          gh release delete app --yes --cleanup-tag || true
          gh release create app \
            --target "$GITHUB_SHA" \
            --title 'Front Desk — the phone app' \
            --notes "$notes" \
            front-desk.apk

      # And a copy under the version's own tag, so a released version keeps the
      # file it shipped with after `app` has moved on to the next build.
      - name: And under this version's tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "The Android app as it shipped in $GITHUB_REF_NAME." \
            front-desk.apk \
            || gh release upload "$GITHUB_REF_NAME" front-desk.apk --clobber

  # Not a build — a Mac runner and a paid Apple account are needed for that, and
  # neither belongs in a workflow that runs on a push. This checks the iOS
  # project is still coherent, so it cannot quietly rot between the times
  # somebody opens Xcode.
  ios-project:
    name: iOS project is intact
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Build the web app
        run: npm --prefix client run build
        env:
          NODE_ENV: production

      # From `client`, for the same reason as the Android job above: `cap` reads
      # its config from the working directory.
      - name: Sync Capacitor
        working-directory: client
        run: npx cap sync ios

      - name: The pieces Xcode will need are all here
        run: |
          set -e
          for f in \
            client/ios/App/App.xcodeproj/project.pbxproj \
            client/ios/App/App/Info.plist \
            client/ios/App/App/public/index.html \
            client/ios/App/Podfile
          do
            test -f "$f" || { echo "::error::missing $f"; exit 1; }
          done
          grep -q NSCameraUsageDescription client/ios/App/App/Info.plist \
            || { echo "::error::Info.plist has no camera usage string — the App Store rejects that"; exit 1; }
          echo "iOS project is intact."
