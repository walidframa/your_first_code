# The vendor's console on HTTPS, written out rather than left to certbot.
#
#   sudo cp /etc/nginx/sites-available/pos-console /root/pos-console.bak
#   sudo sed 's/xtechpos.com/YOUR-DOMAIN/' deploy/nginx-console-https.conf \
#     > /etc/nginx/sites-available/pos-console
#   sudo nginx -t && sudo systemctl reload nginx
#
# **A certificate has to exist first.** The paths below are what certbot writes,
# and nginx will refuse to start without them. If you have not got one yet, use
# `nginx-console.conf` — the plain HTTP one — get a certificate with
#
#   sudo certbot --nginx -d admin.xtechpos.com --redirect --reinstall
#
# and only come back here if the result is wrong.
#
# ---------------------------------------------------------------------------
#
# Why this file exists at all, when certbot writes a config of its own.
#
# Certbot edits in place, and it edits differently depending on what it finds.
# Run once without `--redirect` and it issues a certificate and leaves port 80
# serving the same pages unencrypted. Run again *with* `--redirect` and it sees
# a certificate that is not due for renewal, decides there is nothing to do, and
# changes nothing — so the second run looks like it worked and did not.
# `--reinstall` is what forces it, and nobody guesses that from the symptom.
#
# After two or three passes the file is no longer something you can read and be
# sure about. The shape below is the one to end up at, and it is short enough to
# check by eye:
#
#   one server on 80 that only redirects, one server on 443 that only serves.
#
# There is no third state for a browser to find, and no way for two blocks to
# claim port 80 for the same name — which nginx resolves by silently using the
# first one it parsed and warning about the rest.
#
# `admin` is on the reserved list in provision.js, so no client can be given
# this name.

server {
    listen 80;
    listen [::]:80;
    server_name admin.xtechpos.com;

    # Nothing else lives here. Not the app, not a health check — an exception
    # is a door, and this is the one host where the password on the other side
    # can stop every shop on the machine.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.xtechpos.com;

    ssl_certificate     /etc/letsencrypt/live/admin.xtechpos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.xtechpos.com/privkey.pem;

    # Certbot's own settings — ciphers, protocol versions, and the DH group.
    # If `nginx -t` says these are missing, certbot has never run on this
    # machine: drop both lines and the config is still correct, just without
    # the tuning.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # After one visit the browser refuses to speak plain HTTP to this name at
    # all, so a stray http:// link — an old bookmark, a pasted address — cannot
    # put the console password on the wire. certbot does not add this one.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # This page can stop every shop on the machine. Anything a browser can be
    # persuaded to do to it, it should be persuaded not to.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:4090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
