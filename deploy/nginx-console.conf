# The vendor's console, at admin.<your-domain>.
#
#   sudo sed 's/xtechpos.com/YOUR-DOMAIN/' deploy/nginx-console.conf \
#     > /etc/nginx/sites-available/pos-console
#   sudo ln -sf /etc/nginx/sites-available/pos-console /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.xtechpos.com
#
# `admin` is on the reserved list in provision.js, so no client can ever be
# given this name.

server {
    listen 80;
    listen [::]:80;
    server_name admin.xtechpos.com;

    location / {
        proxy_pass http://127.0.0.1:4090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This page can stop every shop on the machine. Anything a browser can be
    # persuaded to do to it, it should be persuaded not to.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}
