# The vendor's console, at admin.<your-domain>.
#
#   sudo sed 's/xtechpos.com/YOUR-DOMAIN/' deploy/nginx-console.conf \
#     > /etc/nginx/sites-available/pos-console
#   sudo ln -sf /etc/nginx/sites-available/pos-console /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d admin.xtechpos.com --redirect
#
# `--redirect` is not optional here, whatever certbot offers as the default.
# This login can suspend every shop on the machine, and over plain HTTP the
# password crosses the network in the clear. A certificate that exists but is
# not enforced is the worst of the three states, because the padlock is missing
# and everything still appears to work.
#
# `admin` is on the reserved list in provision.js, so no client can ever be
# given this name.

server {
    listen 80;
    listen [::]:80;
    server_name admin.xtechpos.com;

    # Until a certificate exists, plain HTTP is how you reach the machine to get
    # one — certbot rewrites this whole block into a redirect once it has. If
    # you are still seeing "Not secure" in the address bar after running it,
    # certbot was answered "no redirect": re-run it with --redirect.
    location / {
        proxy_pass http://127.0.0.1:4090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This page can stop every shop on the machine. Anything a browser can be
    # persuaded to do to it, it should be persuaded not to.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
}

# ---------------------------------------------------------------------------
# certbot writes the HTTPS block itself. If you are doing it by hand, or want to
# check what it left behind, this is the shape it should have:
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name admin.xtechpos.com;
#
#     ssl_certificate     /etc/letsencrypt/live/admin.xtechpos.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/admin.xtechpos.com/privkey.pem;
#
#     # Added by hand — certbot does not write this one, and this is the host
#     # where it matters most. After the first visit the browser refuses to
#     # speak plain HTTP to this name at all, so a stray http:// link cannot put
#     # the console password on the wire.
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     add_header X-Frame-Options DENY always;
#     add_header X-Content-Type-Options nosniff always;
#     add_header Referrer-Policy no-referrer always;
#
#     location / { ... same proxy_pass block as above ... }
# }
#
# and the port 80 block reduced to nothing but:
#
#     return 301 https://$host$request_uri;
