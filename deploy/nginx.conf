# nginx in front of the POS.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pos
#   sudo ln -s /etc/nginx/sites-available/pos /etc/nginx/sites-enabled/pos
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pos.example.com     # adds the HTTPS block below
#
# Replace pos.example.com with your domain throughout.
#
# The app can serve itself on port 4000 without any of this. nginx is here for
# the two things it does that Node should not have to: terminate HTTPS, and be
# the thing on port 443 that is already configured to renew a certificate.

server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    # certbot rewrites this to a redirect once a certificate is issued. Until
    # then, plain HTTP is how you reach it to get one.
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A CSV import or a catalogue with images is bigger than nginx's 1MB
        # default, and the failure looks like the app rejecting the file.
        client_max_body_size 12m;

        # Long enough for an import to finish, short enough that a hung request
        # does not sit there forever.
        proxy_read_timeout 120s;
    }

    # Never let a browser cache the page that names the current assets, or an
    # update reaches the server and not the till. The app sends this header
    # itself; this is the belt to that pair of braces.
    location = /index.html {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }

    # Anyone probing for a shop's admin panel from the open internet is not a
    # customer. Worth knowing about; harmless to leave off.
    # access_log /var/log/nginx/pos.access.log;
}

# ---------------------------------------------------------------------------
# Once certbot has run it writes an HTTPS server block of its own. If you are
# doing it by hand instead, it looks like this:
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name pos.example.com;
#
#     ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;
#
#     # The shop holds customers' iCloud passwords. HTTPS is not optional here.
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
#     location / { ... same proxy_pass block as above ... }
# }
